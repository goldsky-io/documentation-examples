name: "compose-vrf"
api_version: "stable"

tasks:
  # Utility task to get the Compose wallet address
  - path: "./src/tasks/generate-wallet.ts"
    name: "generate_wallet"
    triggers:
      - type: "http"
        authentication: "auth_token"

  # HTTP endpoint to request randomness (no MetaMask needed)
  - path: "./src/tasks/request-randomness.ts"
    name: "request_randomness"
    triggers:
      - type: "http"
        authentication: "auth_token"

  # Main fulfillment task - triggered by on-chain event
  - path: "./src/tasks/fulfill-randomness.ts"
    name: "fulfill_randomness"
    triggers:
      - type: "onchain_event"
        network: "base_sepolia"
        # No-deploy option: to try this without deploying your own contract, use
        # the totally open RandomnessConsumer on Base Sepolia (anyone can fulfill):
        # 0x6273AB73C95Ba2233281F1eb8aa3b21D9352AD6d. Keep this in sync with
        # CONTRACT_ADDRESS in src/tasks/request-randomness.ts and fulfill-randomness.ts.
        contract: "0xE05Ceb3E269029E3bab46E35515e8987060D1027"
        events:
          - "RandomnessRequested(uint256,address)"
    retry_config:
      max_attempts: 3
      initial_interval_ms: 1000
      backoff_factor: 2
